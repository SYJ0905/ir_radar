name: Build iRadar.exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller iRadar.spec

      - name: Verify exe exists
        run: |
          if (Test-Path "dist/iRadar.exe") {
            Write-Host "Build successful: dist/iRadar.exe"
            Get-Item "dist/iRadar.exe" | Select-Object Name, Length
          } else {
            Write-Error "Build failed: iRadar.exe not found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iRadar-windows
          path: dist/iRadar.exe
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/iRadar.exe
          generate_release_notes: true
